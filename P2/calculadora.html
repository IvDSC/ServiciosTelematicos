<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Calculadora de Temperaturas</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/iroom.css">
    <script>
        // 1. VARIABLES GLOBALES (Para guardar el estado de la calculadora)
        let operandoActual = "";
        let operandoAnterior = "";
        let operacionPendiente = undefined;

        function Numerointroducido(numero) {
            if (typeof operandoActual === "number") {
                operandoActual = numero; 
            } else {
                operandoActual = operandoActual + numero;
            }
            MostrarporPantalla();
        }
        function Operacion(operador) {
            if (operandoActual === ""){
                alert("Introduce un valor antes de seleccionar una operación."); 
                return; 
            }
            if (operador === "^") {
                operacionPendiente = "^";
                operandoAnterior = operandoActual;
                Calcular();
                return; 
            }
            if (operandoAnterior !== "") {
                Calcular(); 
            }
            operacionPendiente = operador;
            operandoAnterior = operandoActual;
            operandoActual = ""; 
        }
        // 4. ESTRUCTURA DE CONTROL PARA EL CÁLCULO (Uso de 'switch')
        function Calcular() {
            let resultado;
            // Convertimos los textos de las variables a números reales para calcular
            let anterior = Number(operandoAnterior);
            let actual = Number(operandoActual);
            switch (operacionPendiente) {
                case "+":
                    resultado = anterior + actual;
                    break;
                case "-":
                    resultado = anterior - actual;
                    break;
                case "*":
                    resultado = anterior * actual;
                    break;
                case "/":
                    resultado = anterior / actual;
                    break;
                case "^":
                    resultado = actual * actual;
                    break;
                case "K":
                    CambioaKelvin();
                    break;
                case "F":
                    CambioaFahrenheit();
                    break;
                case "C":
                    CambioaCelsius();
                    break;
                default:
                    alert("Faltan números para realizar la operación seleccionada");
                    return; 
            }
            for(i=0; i<=10; i++){            
            operandoActual = resultado;
            operacionPendiente = undefined;
            operandoAnterior = "";
            MostrarporPantalla();
            }
        }

        // 5. FUNCIÓN PARA LIMPIAR TODO (Botón C)
        function Borrar() {
            operandoActual = "";
            operandoAnterior = "";
            operacionPendiente = undefined;
            MostrarporPantalla();
        }

        // 6. ACTUALIZAR EL DOM
        function MostrarporPantalla() {
            document.getElementById("pantalla").value = operandoActual;
        }
    </script>
</head>
<body>
    <div id="header">
        <h1 class="Título">Calculadora de Temperatura</h1>
        <div class="texto-columnas">
            <div class="">
                <h2>Cambio de Unidades</h2>
            </div>
                <div class="calculadora">
                <input type="text" id="pantalla" readonly>
                <div class="fila">
                    <button class="button-numero" onclick="Numerointroducido('7')">7</button>
                    <button class="button-numero" onclick="Numerointroducido('8')">8</button>
                    <button class="button-numero" onclick="Numerointroducido('9')">9</button>
                    <button class="btn-operacion" onclick="Operacion('+')">+</button>
                </div>
                <div class="fila">
                    <button class="button-numero" onclick="Numerointroducido('4')">4</button>
                    <button class="button-numero" onclick="Numerointroducido('5')">5</button>
                    <button class="button-numero" onclick="Numerointroducido('6')">6</button>
                    <button class="btn-operacion" onclick="Operacion('-')">-</button>
                </div>
                <div class="fila">
                    <button class="button-numero" onclick="Numerointroducido('1')">1</button>
                    <button class="button-numero" onclick="Numerointroducido('2')">2</button>
                    <button class="button-numero" onclick="Numerointroducido('3')">3</button>
                    <button class="btn-operacion" onclick="Operacion('*')">*</button>
                </div>
                <div class="fila">
                    <button class="button-numero" onclick="Numerointroducido('.')">.</button>
                    <button class="button-numero" onclick="Numerointroducido('0')">0</button>
                    <button class="btn-operacion" onclick="Calcular()">=</button>
                    <button class="btn-operacion" onclick="Operacion('/')">/</button>
                </div>
                <div class="fila">
                    <button class="btn-operacion" onclick="Operacion('^')">x²</button>
                    <button class="btn-operacion" onclick="CambioaKelvin('K')">K</button>
                    <button class="btn-operacion" onclick="CambioaFahrenheit('F')">F</button>
                    <button class="btn-operacion" onclick="CambioaCelsius('C')">C</button>
                </div>
                <div class="fila">
                    <button class="btn-limpiar" onclick="Borrar()">Borrar</button>
                </div> 
            </div>
            <h2>Historial de Temperaturas Calculadas</h2>
        </div>
        <footer class="Universidad" id="footer">
            <a href="index.html"> Universidad de Alcala</a>            
        </footer>
    </div>
</body>
</html>
