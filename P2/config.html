<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Proyecto Practica 1</title>
        <link rel="stylesheet" href="css/iroom.css">
        <link rel="icon" href="favicon.ico" type="image/x-icon">
    </head>
    
    <body id="body" onload="botonMaps();botonCiudadMaps(); enviarTemperatura();">
            <div id="header">
                <h1 class="Título">Smart Room Project</h1>
                <datalist id="paises">
                                <option value="España">
                                <option value="Francia">
                                <option value="Italia">
                                <option value="Alemania">
                                <option value="Portugal">
                </datalist>
                <form>
                    <section class="formulario">
                        <a href="https://maps.google.com" target="_blank">Datos de la habitación</a>
                        <ul>
                            <li><label for="pais">Pais: </label>
                            <input id="pais" type="text" name="pais" list="paises"></li>
                                <li><label for="ciudad">Ciudad: </label>
                                <input id="ciudad" type="text" name="ciudad"><button id="botonciudad" type="button" onclick="abrirMapsCiudad();"> => </button></li>
                                <li><label for="coordenadas">Coordenadas GPS:</label>
                                <input id="coordenadas" type="text" name="coordenadas"> <button id="botoncoords" type="button" onclick="abrirMaps();"> => </button></li>
                                <li><label for="url">URL: </label>
                                <input id="url" type="url" name="url"></li>
                                <li><label for="foto">Foto: </label>
                                <input id="foto" type="file" name="foto"></li>
                                <li><label for="contraseña">Contraseña: </label>
                                <input id="contraseña" type="password" name="contraseña" placeholder="*********"></li>
                            </ul>
                            <button id="boton" type="submit" onclick="limpiarAvisos(); comprobarPaises(); VerificarTemperatura(); comprobarContrasena(); coordsGPS(event); coordsCiudad(event); mostrarVentana(event);">Enviar datos</button>
                    </section>
                    <section class="formulario">
                        <a>Datos de los sensores</a>
                            <ul>
                                <li><label for="temperatura">Temperatura: </label><input id="temperatura" type="checkbox" name="temperatura"></li>
                                <li><label for="humedad">Humedad: </label><input id="humedad" type="checkbox" name="humedad"></li>
                                <li><label for="sonido">Nivel de sonido: </label><input id="sonido" type="checkbox" name="sonido"></li>
                                <li><label for="luz">Nivel de luz: </label><input id="luz" type="checkbox" name="luz"></li>
                                <li><label for="movimiento">Movimiento: </label><input id="movimiento" type="checkbox" name="movimiento"></li>
                            </ul>
                        <a>Configure alertas</a>
                            <ul>
                                <li><label for="temp_max">Temperatura maxima: </label><input id="temp_max" type="number" step = "5" max = "45" min = "-20"  name="temp_max" placeholder="max 45"></li>
                                <li><label for="temp_min">Temperatura minima: </label><input id="temp_min" type="number" step = "5" max = "45" min = "-20"  name="temp_min" placeholder="min -20"></li>
                            </ul>
                    </section>
                </form>
                <div id="ventana">
                    <div id="ventana-cabecera">
                        <h1>Aviso!</h1>
                        <hr>
                    </div>
                    <div id="ventana-contenido">
                        <span id="avisos"></span>
                        <button id="botonventana" onclick="quitarVentana(event);"> X </button>
                    </div>
                </div>
                <footer class="Universidad" id="footer">
                    
                    <a href="index.html"> Universidad de Alcala</a>
                    
                </footer>
            </div>
        <script src="datos.js"></script>
    </body>
</html>
