<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Proyecto Practica 1</title>
        <link rel="stylesheet" href="css/iroom.css">
        <link rel="icon" href="favicon.ico" type="image/x-icon">
    </head>
    
    <body id="body">
            <div id="header">
                <h1 class="Título">Smart Room Project</h1>
                <section class="formulario">
                    <a href="https://maps.google.com" target="_blank">Datos de la habitación</a>
                    <form>
                        <ul>
                            <li><label for="pais">Pais: </label>
                            <input type="text" name="pais" list="paises"></li>
                            <datalist id="paises">
                                <option value="España">
                                <option value="Francia">
                                <option value="Italia">
                                <option value="Alemania">
                                <option value="Portugal">
                            </datalist>
                            <li><label for="ciudad">Ciudad: </label>
                            <input type="text" name="ciudad"></li>
                            <li><label for="coordenadas">Coordenadas GPS: </label>
                            <input type="text" name="coordenadas"></li>
                            <li><label for="url">URL: </label>
                            <input type="url" name="url"></li>
                            <li><label for="foto">Foto: </label>
                            <input type="file" name="foto"></li>
                            <li><label for="contraseña">Contraseña: </label>
                            <input type="password" name="contraseña"></li>
                        </ul>
                        <button type="submit" onclick="VerificarTemperatura()">Enviar datos</button>
                </section>
                <section class="formulario">
                    <a>Datos de los sensores</a>
                        <ul>
                            <li><label for="temperatura">Temperatura: </label><input type="checkbox" name="temperatura"></li>
                            <li><label for="humedad">Humedad: </label><input type="checkbox" name="humedad"></li>
                            <li><label for="sonido">Nivel de sonido: </label><input type="checkbox" name="sonido"></li>
                            <li><label for="luz">Nivel de luz: </label><input type="checkbox" name="luz"></li>
                            <li><label for="movimiento">Movimiento: </label><input type="checkbox" name="movimiento"></li>
                        </ul>
                    <a>Configure alertas</a>
                        <ul>
                            <li><label for="temp_max">Temperatura maxima: </label><input type="number" step = "5" max = "45" min = "-20"id = "max" name="temp_max"></li>
                            <li><label for="temp_min">Temperatura minima: </label><input type="number" step = "5" max = "45" min = "-20" id = "min" name="temp_min"></li>
                        </ul>
                    </form>
                </section>
                <footer class="Universidad">
                    
                    <a href="index.html"> Universidad de Alcala</a>
                    
                </footer>
            </div>
        <script src="datos.js"></script>
    </body>
</html>
